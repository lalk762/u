<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Cursor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="brand"><span class="mark">✦</span><div><h1>AI Cursor</h1><p>Курсор-помощник для вкладки</p></div></div>
    <p class="notice">Доступ действует только для вкладки, на которой ты открыл это меню.</p>
    <button id="show" class="primary">Показать AI-курсор</button>
    <button id="demo">Демо: найти элемент</button>
    <button id="hide" class="quiet">Скрыть курсор</button>
    <p id="status" role="status">Готов к запуску.</p>
    <footer>Пока это локальное демо: курсор не подключён к ChatGPT и сам ничего не нажимает.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d20">
<title>Звёздный ловец — мини-игра</title>
<style>
:root{color-scheme:dark;--bg:#090d20;--panel:#121a35;--text:#f4f6ff;--muted:#aab5d5;--cyan:#71f3df;--violet:#a78bfa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#26376b 0,transparent 48%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:20px}
main{width:min(760px,100%)}header{text-align:center;margin-bottom:24px}.logo{font-size:13px;letter-spacing:.22em;color:var(--cyan);font-weight:800}h1{font-size:clamp(40px,8vw,68px);letter-spacing:-.06em;margin:12px 0 8px}header p{color:var(--muted);margin:0}
.panel{background:#121a35dc;border:1px solid #ffffff20;border-radius:26px;padding:22px;box-shadow:0 25px 90px #0007}
.stats{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}.stat{background:#ffffff0b;border:1px solid #ffffff12;border-radius:14px;padding:12px 16px;flex:1;text-align:center}.stat small{display:block;color:var(--muted);font-size:12px}.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.arena{height:340px;position:relative;overflow:hidden;border-radius:18px;border:1px solid #ffffff18;background:radial-gradient(circle at 20% 30%,#ffffff12 0 1px,transparent 2px),radial-gradient(circle at 75% 65%,#ffffff18 0 1px,transparent 2px),linear-gradient(145deg,#101b3a,#171332);background-size:53px 53px,71px 71px,auto}
.target{position:absolute;width:54px;height:54px;border:0;border-radius:50%;background:linear-gradient(145deg,#fff7b0,#ffd166 55%,#f59e0b);box-shadow:0 0 18px #ffd16699,0 0 45px #f59e0b55;cursor:pointer;font-size:27px;display:grid;place-items:center;transition:transform .12s}.target:hover{transform:scale(1.12)}.target:active{transform:scale(.88)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:#080d20a8;backdrop-filter:blur(5px)}.overlay.hidden{display:none}.message{max-width:340px}.message h2{font-size:28px;margin:0 0 8px}.message p{color:var(--muted);line-height:1.5}
button.action{background:linear-gradient(100deg,var(--cyan),#a7f3d0);color:#081322;border:0;border-radius:13px;padding:13px 20px;font-weight:800;font-size:15px;cursor:pointer}.hint{text-align:center;color:var(--muted);font-size:13px;margin:15px 0 0}
@media(max-width:520px){.panel{padding:14px}.arena{height:380px}.stats{gap:7px}.stat{padding:10px 5px}.stat b{font-size:21px}}
</style>
</head>
<body><main>
<header><div class="logo">✦ МИНИ-ИГРА</div><h1>Звёздный ловец</h1><p>Лови звёзды и набирай очки за 20 секунд.</p></header>
<section class="panel">
<div class="stats"><div class="stat"><small>СЧЁТ</small><b id="score">0</b></div><div class="stat"><small>ВРЕМЯ</small><b><span id="time">20</span>с</b></div><div class="stat"><small>РЕКОРД</small><b id="best">0</b></div></div>
<div class="arena" id="arena" aria-label="Игровое поле">
<div class="overlay" id="overlay"><div class="message"><h2 id="title">Готов к полёту?</h2><p id="description">Нажимай на появляющиеся звёзды. У тебя будет 20 секунд!</p><button class="action" id="start">Начать игру</button></div></div>
</div><p class="hint">Подсказка: звёзды появляются в разных местах поля ✨</p>
</section></main>
<script>
const arena=document.getElementById('arena'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best');
let score=0,time=20,active=false,clock=null,star=null,best=0;
try{best=Number(localStorage.getItem('star-catcher-best'))||0}catch{}bestEl.textContent=best;
function placeStar(){if(!active)return;if(star)star.remove();star=document.createElement('button');star.className='target';star.type='button';star.textContent='★';star.setAttribute('aria-label','Поймать звезду');const maxX=Math.max(0,arena.clientWidth-58),maxY=Math.max(0,arena.clientHeight-58);star.style.left=Math.round(Math.random()*maxX)+'px';star.style.top=Math.round(Math.random()*maxY)+'px';star.addEventListener('click',()=>{if(!active)return;score++;scoreEl.textContent=score;placeStar()});arena.appendChild(star)}
function finish(){active=false;clearInterval(clock);if(star)star.remove();if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('star-catcher-best',String(best))}catch{}}document.getElementById('title').textContent='Отличная игра!';document.getElementById('description').textContent='Ты поймал(а) '+score+' звёзд. Хочешь попробовать ещё раз?';document.getElementById('start').textContent='Играть снова';overlay.classList.remove('hidden')}
function start(){score=0;time=20;active=true;scoreEl.textContent=score;timeEl.textContent=time;overlay.classList.add('hidden');placeStar();clearInterval(clock);clock=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000)}
document.getElementById('start').addEventListener('click',start);
</script></body></html>
